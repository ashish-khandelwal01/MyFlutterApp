name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.5'

      - name: Install Dependencies
        run: flutter pub get

        # Build Web
      - name: Build Web App
        run: flutter build web --base-href /MyFlutterApp/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          publish_dir: build/web

      - name: List android directory
        run: ls -R android
      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip commandlinetools-linux-8512546_latest.zip -d /usr/local/lib/android-sdk
          sudo rm commandlinetools-linux-8512546_latest.zip
          yes | sudo /usr/local/lib/android-sdk/tools/bin/sdkmanager --sdk_root=/usr/local/lib/android-sdk --licenses
          sudo /usr/local/lib/android-sdk/tools/bin/sdkmanager --update

      - name: Install required SDK components
        run: |
          sudo /usr/local/lib/android-sdk/tools/bin/sdkmanager --update
          sudo /usr/local/lib/android-sdk/tools/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      - name: Flutter doctor
        run: flutter doctor -v
      # Build Android APK
      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk