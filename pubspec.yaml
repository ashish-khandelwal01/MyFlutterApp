name: my_flutter_app
description: A Flutter application with image galleries and custom transitions.
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Add any additional dependencies here
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  android:
    enableV2Embedding: true
  uses-material-design: true

  assets:
    - assets/image1.png
    - assets/image2.jpg
    - assets/image3.jpg
    - assets/image4.jpg
    - assets/image5.jpg
    - assets/image6.jpg
    - assets/image7.png
    - assets/image8.jpg
    - assets/icon/app_icon.png
